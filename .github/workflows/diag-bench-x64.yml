# Diagnostic, run by hand (workflow_dispatch): the micro-benchmarks against pion on a plain x86-64
# runner (or Linux arm64, with the `runner` input), with the CPU model, many runs, and no gating.
# For tuning where only a real machine of that architecture gives the answer.
name: diag-bench-x64

on:
  workflow_dispatch:
    inputs:
      runs:
        description: runs per implementation
        default: "15"
      runner:
        description: runner image; ubuntu-24.04-arm for Linux arm64
        type: choice
        options: [ ubuntu-latest, ubuntu-24.04-arm ]
        default: ubuntu-latest

jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/pion-compare/go/go.mod
          cache-dependency-path: benchmarks/pion-compare/go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/pion-compare
      - name: Machine
        run: |
          lscpu | grep -E 'Model name|MHz|Flags|Features' | cut -c1-200
          rustc -vV | head -3; go version
      - name: Compare
        run: python3 benchmarks/pion-compare/compare.py --runs "${{ inputs.runs }}" --no-gate
