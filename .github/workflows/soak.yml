# Long-running soak of rtc against Go pion/webrtc over loopback with netem impairment, to catch
# drift that short tests miss (counter wraparound, slow leaks, growing queues, failed recovery). The
# report job holds rtc-rtc against pion-pion (the same run, the same machine type) and fails when
# rtc is less stable, when a pair job failed or when a pair left no measurements.
# Weekly and by hand: two hours. On a pull request that touches the harness: ten minutes, five-
# minute cycles. Three profiles: `call` (the call under netem phases), `abuse` (the same call while
# hostile connections, traffic and a hostile network are thrown at it; pairs rtc-rtc and pion-pion
# only, with the same seed, the run id, so both libraries get the same abuse) and `trace` (the call
# over recorded cellular links, replayed from the same seed; all three pairs, the call's rules). A
# crash fails the job. See benchmarks/soak/README.md.
name: soak

on:
  schedule:
    - cron: '0 3 * * 0' # Sunday
  workflow_dispatch:
    inputs:
      minutes:
        description: run length per pair, minutes
        default: "120"
      pairs:
        description: 'pairs to run, a JSON array'
        default: '["rtc-rtc","pion-pion","rtc-pion"]'
      archs:
        description: 'architectures to run, a JSON array'
        default: '["x64","arm64"]'
      profiles:
        description: 'profiles to run, a JSON array'
        default: '["call","abuse","trace"]'
      rtc_peer_env:
        description: 'VAR=value words (space separated) set in the environment of the rtc peers only; empty for none'
        default: ""
      seed:
        description: 'seed of the abuse schedule and trace replay; empty = the run id. Reuse one to replay the same weather'
        default: ""
      rtc_peer_features:
        description: 'cargo features of the rtc peer build (heap-profile writes dhat-heap-*.json); empty for none'
        default: ""
  pull_request:
    paths:
      - 'benchmarks/soak/**'
      - '.github/workflows/soak.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MINUTES: ${{ github.event_name == 'pull_request' && '10' || inputs.minutes || '120' }}
  CYCLE_MIN: ${{ github.event_name == 'pull_request' && '5' || '20' }}
  # The combinations of the run: all of them unless a manual run chose some (the matrix and the report job read these).
  PAIRS: ${{ inputs.pairs || '["rtc-rtc","pion-pion","rtc-pion"]' }}
  ARCHS: ${{ inputs.archs || '["x64","arm64"]' }}
  PROFILES: ${{ inputs.profiles || '["call","abuse","trace"]' }}

jobs:
  soak:
    name: soak ${{ matrix.pair }} / ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 180 # the run is bounded by MINUTES (120 by default) plus the build; expressions have no arithmetic
    # pion failing is the baseline's finding, not rtc's: the report compares rtc over the minutes pion ran.
    continue-on-error: ${{ matrix.pair == 'pion-pion' }}
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(inputs.pairs || '["rtc-rtc","pion-pion","rtc-pion"]') }}
        arch: ${{ fromJSON(inputs.archs || '["x64","arm64"]') }}
        profile: ${{ fromJSON(inputs.profiles || '["call","abuse","trace"]') }}
        exclude:
          - pair: rtc-pion # the mixed pair is a call comparison only
            profile: abuse
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/soak/go/go.mod
          cache-dependency-path: benchmarks/soak/go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/soak
          key: ${{ matrix.arch }}
      - name: Machine
        run: |
          uname -m; lscpu | grep -E 'Model name' | cut -c1-120
          rustc -vV | head -3; go version
      - name: netem
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
          tc -V
      - name: Traces
        if: matrix.profile == 'trace'
        run: |
          dir="$RUNNER_TEMP/soak-traces"
          benchmarks/soak/traces.sh "$dir"
          echo "TRACE_DIR=$dir" >> "$GITHUB_ENV"
      - name: Report tests
        run: python3 -m unittest discover -s benchmarks/soak -p 'test_*.py'
      - name: Soak
        env:
          PROFILE: ${{ matrix.profile }}
          RTC_PEER_ENV: ${{ inputs.rtc_peer_env }}
          RTC_PEER_FEATURES: ${{ inputs.rtc_peer_features }}
          SEED: ${{ inputs.seed || github.run_id }} # the same for every job of the run: one schedule of abuse, one trace replay for all
        run: scripts/ci-run.sh benchmarks/soak/run.sh "${{ matrix.pair }}" "$MINUTES" soak-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.pair }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            soak-out/*.jsonl
            soak-out/*.log
            soak-out/machine.txt
            soak-out/dhat-heap-*.json

  report:
    name: report
    needs: soak
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: soak-*-*
          path: soak-in
      - name: Every pair produced its measurements
        id: inputs
        run: |
          missing=0
          for profile in $(jq -r '.[]' <<<"$PROFILES"); do
            for pair in $(jq -r '.[]' <<<"$PAIRS"); do
              [ "$profile" = abuse ] && [ "$pair" = rtc-pion ] && continue
              for arch in $(jq -r '.[]' <<<"$ARCHS"); do
                if [ -z "$(find "soak-in/soak-$pair-$arch-$profile" -name '*.jsonl' -size +0 2>/dev/null)" ]; then
                  echo "::error::no measurements from $pair on $arch ($profile)"
                  missing=1
                fi
              done
            done
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - name: Combined report
        id: report
        run: |
          set +e
          # One report per architecture and profile: the pairs of one are compared with each other.
          status=0
          for profile in $(jq -r '.[]' <<<"$PROFILES"); do
            rules=rules.json
            [ "$profile" = abuse ] && rules='rules-abuse.json'
            for arch in $(jq -r '.[]' <<<"$ARCHS"); do
              mapfile -t files < <(find "soak-in" -path "*-$arch-$profile/*" -name '*.jsonl' | sort)
              python3 benchmarks/soak/report.py --rules "benchmarks/soak/$rules" --out "soak-report/$arch-$profile" \
                "${files[@]}" || status=1
            done
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summary
        if: always()
        run: |
          for profile in $(jq -r '.[]' <<<"$PROFILES"); do
            for arch in $(jq -r '.[]' <<<"$ARCHS"); do
              [ -f "soak-report/$arch-$profile/summary.md" ] && { echo "## $arch, $profile"; cat "soak-report/$arch-$profile/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-report
          path: |
            soak-report/**/report.html
            soak-report/**/summary.md
            soak-in/**/*.jsonl
            soak-in/**/machine.txt
      - name: Fail when a pair failed, left nothing, or rtc is less stable than pion
        if: always() && (needs.soak.result != 'success' || steps.inputs.outputs.missing != '0' || steps.report.outputs.status != '0')
        run: |
          echo "pair jobs: ${{ needs.soak.result }}; missing measurements: ${{ steps.inputs.outputs.missing }}; report status: ${{ steps.report.outputs.status }}"
          exit 1
