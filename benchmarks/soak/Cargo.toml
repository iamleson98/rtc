[package]
name = "soak-rtc"
version = "0.0.0"
edition = "2024"
publish = false
description = "The rtc half of the soak harness; see README.md"

# Standalone workspace on purpose: this is a measurement tool, not part of the rtc build, and
# keeping it out of the main workspace keeps `cargo test --workspace` from compiling it.
[workspace]

[[bin]]
name = "soak-rtc"
path = "src/main.rs"

[dependencies]
rtc = { path = "../..", package = "rtc" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dhat = { version = "=0.3.3", optional = true }

[features]
# Swap the counting allocator for dhat and write dhat-heap-<id>.json next to --out: allocation sites, not totals.
heap-profile = ["dep:dhat"]

[profile.release]
opt-level = 3
