[package]
name = "soak-rtc"
version = "0.0.0"
edition = "2024"
publish = false
description = "The rtc half of the soak harness; see README.md"

# Standalone workspace on purpose: this is a measurement tool, not part of the rtc build, and
# keeping it out of the main workspace keeps `cargo test --workspace` from compiling it.
[workspace]

[[bin]]
name = "soak-rtc"
path = "src/main.rs"

[dependencies]
rtc = { path = "../..", package = "rtc" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
